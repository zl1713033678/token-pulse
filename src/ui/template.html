<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Token Pulse</title>
  <style>
/*__INLINE_CSS__*/
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="top-bar">
      <div class="segmented-tabs" role="tablist" aria-label="Token Pulse 视图">
        <button type="button" role="tab" id="tab-live" aria-selected="true" tabindex="0" data-tab="live">实时</button>
        <button type="button" role="tab" id="tab-trends" aria-selected="false" tabindex="-1" data-tab="trends">趋势</button>
      </div>

      <div class="toolbar-right">
        <div class="surface-pills" role="group" aria-label="终端来源过滤">
          <button type="button" class="pill-btn" data-surface="all" aria-pressed="true">全部 <span id="count-all" class="pill-count"></span></button>
          <button type="button" class="pill-btn" data-surface="desktop" aria-pressed="false">桌面 <span id="count-desktop" class="pill-count"></span></button>
          <button type="button" class="pill-btn" data-surface="cli" aria-pressed="false">CLI <span id="count-cli" class="pill-count"></span></button>
        </div>

        <button type="button" id="btn-privacy" class="icon-btn icon-only" aria-pressed="false" title="切换项目与会话名称隐私脱敏" aria-label="切换项目与会话名称隐私脱敏">
          <svg viewBox="0 0 16 16" width="13.5" height="13.5" fill="none" aria-hidden="true">
            <path d="M8 1.6 13.2 3.7v3.8c0 3.2-2.2 5.9-5.2 6.9-3-1-5.2-3.7-5.2-6.9V3.7L8 1.6Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" />
          </svg>
        </button>

        <button type="button" id="btn-refresh" class="icon-btn icon-only" title="立即刷新" aria-label="立即刷新数据">
          <svg viewBox="0 0 16 16" width="13.5" height="13.5" fill="none" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.65M13.5 2.5v2.75h-2.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="session-bar">
      <span id="status-dot" class="sync-dot" aria-hidden="true"></span>
      <select id="session-select" class="select-control" aria-label="选择目标会话">
        <option value="">读取本地会话中…</option>
      </select>
      <span id="sync-label" class="sync-time num" title="最近一次本地只读同步时间">实时</span>
    </div>

    <main class="panels-root">
      <div role="tabpanel" id="panel-live" aria-labelledby="tab-live">
        <div id="body-live" class="panel-body"></div>
      </div>
      <div role="tabpanel" id="panel-trends" aria-labelledby="tab-trends" hidden>
        <div id="body-trends" class="panel-body"></div>
      </div>
    </main>
  </div>

  <script>
/*__INLINE_JS__*/
  </script>
</body>
</html>
