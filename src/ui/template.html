<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Token Pulse</title>
  <style>
/*__INLINE_CSS__*/
  </style>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.22" stroke-width="2.4" />
            <path d="M12 3a9 9 0 1 1-7.8 13.5" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" />
            <path d="M6.5 12.5h2.3l1.5-3.6 2 6.8 1.6-4.4 1.2 1.2h2.4" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <div class="brand-copy">
          <div class="brand-title-row">
            <h1 class="brand-title">Token Pulse</h1>
            <span id="env-badge" class="badge-pill">Local SQLite</span>
          </div>
          <p id="header-sub" class="brand-sub">读取 Antigravity 本地遥测中…</p>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="btn-privacy" class="icon-btn" aria-pressed="false" title="切换项目与会话名称隐私脱敏">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M8 1.6 13.2 3.7v3.8c0 3.2-2.2 5.9-5.2 6.9-3-1-5.2-3.7-5.2-6.9V3.7L8 1.6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
          </svg>
          <span id="privacy-label">脱敏</span>
        </button>
        <button type="button" id="btn-refresh" class="icon-btn icon-only" title="立即刷新" aria-label="立即刷新数据">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.65M13.5 2.5v2.75h-2.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>

    <div class="filter-bar">
      <div class="surface-pills" role="group" aria-label="Surface 过滤">
        <button type="button" class="pill-btn" data-surface="all" aria-pressed="true">全部 <span id="count-all" class="pill-count"></span></button>
        <button type="button" class="pill-btn" data-surface="desktop" aria-pressed="false">Desktop <span id="count-desktop" class="pill-count"></span></button>
        <button type="button" class="pill-btn" data-surface="cli" aria-pressed="false">CLI <span id="count-cli" class="pill-count"></span></button>
      </div>
      <div class="sync-status">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="sync-label">本地实时</span>
      </div>
    </div>

    <nav class="segmented-tabs" role="tablist" aria-label="Token Pulse 视图">
      <button type="button" role="tab" id="tab-overview" aria-selected="true" tabindex="0" data-tab="overview">总览</button>
      <button type="button" role="tab" id="tab-context" aria-selected="false" tabindex="-1" data-tab="context">上下文</button>
      <button type="button" role="tab" id="tab-pace" aria-selected="false" tabindex="-1" data-tab="pace">节奏</button>
      <button type="button" role="tab" id="tab-trends" aria-selected="false" tabindex="-1" data-tab="trends">趋势</button>
    </nav>

    <main class="panels-root">
      <div role="tabpanel" id="panel-overview" aria-labelledby="tab-overview">
        <div id="body-overview" class="panel-body"></div>
      </div>
      <div role="tabpanel" id="panel-context" aria-labelledby="tab-context" hidden>
        <div id="body-context" class="panel-body"></div>
      </div>
      <div role="tabpanel" id="panel-pace" aria-labelledby="tab-pace" hidden>
        <div id="body-pace" class="panel-body"></div>
      </div>
      <div role="tabpanel" id="panel-trends" aria-labelledby="tab-trends" hidden>
        <div id="body-trends" class="panel-body"></div>
      </div>
    </main>

    <footer class="app-footer">
      <span>纯本地 SQLite · 零额外模型 Token</span>
      <span id="footer-status" class="mono">0 extra tokens</span>
    </footer>
  </div>

  <script>
/*__INLINE_JS__*/
  </script>
</body>
</html>
